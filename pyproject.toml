[project]
name = "flashcard-quiz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "ast-serialize>=0.5.0",
    "black>=26.5.1",
    "click>=8.4.1",
    "isort>=8.0.1",
    "librt>=0.11.0",
    "mypy>=2.1.0",
    "mypy-extensions>=1.1.0",
    "pathspec>=1.1.1",
    "platformdirs>=4.10.0",
    "pytokens>=0.4.1",
    "typing-extensions>=4.15.0",
]

[project.scripts]
flashcard = "flashcard_quiz.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
    "pytest-cov>=7.1.0",
]
