[project]
name = "flashcard-quiz"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
flashcard = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88

[dependency-groups]
dev = [
    "flake8-pyproject>=1.2.4",
    "pytest-cov>=7.1.0",
]
